<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExamHub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p>ExamHub</p>
        <h1 data-i18n="pageTitle">Online exam workspace</h1>
      </div>
      <div class="toolbar-controls">
        <label class="lang-select">
          <span data-i18n="languageLabel">Language</span>
          <select id="language-switch">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
          </select>
        </label>
        <button type="button" id="theme-toggle">Dark mode</button>
      </div>
      <nav>
        <button type="button" data-view="create-view" data-i18n="navCreate">Create Exam</button>
        <button type="button" data-view="admin-view" data-i18n="navAdmin">Examiner Admin</button>
        <button type="button" data-view="student-view" data-i18n="navStudent">Student Exam</button>
      </nav>
    </header>

    <main class="shell">
      <section id="create-view" class="panel view">
        <div class="section-heading">
          <p data-i18n="roleExaminer">Examiner</p>
          <h2 data-i18n="createHeading">Create exam and account</h2>
        </div>

        <form id="exam-form">
          <div class="grid-2">
            <label>
              Exam name
              <input name="examName" placeholder="Biology Final 2026" required>
            </label>
            <label>
              Examiner full name
              <input name="examinerName" placeholder="Mrs. Mensah" required>
            </label>
            <label>
              Examiner username
              <input name="examinerUsername" autocomplete="username" placeholder="mensah_admin" required>
            </label>
            <label>
              Examiner password
              <input name="examinerPassword" type="password" autocomplete="new-password" required>
            </label>
            <label>
              Exam status
              <select name="examStatus">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option value="closed">Closed</option>
              </select>
            </label>
            <label>
              Passing score
              <input name="passingScore" type="number" min="0" placeholder="60">
            </label>
            <label>
              Duration (minutes)
              <input name="durationMinutes" type="number" min="0" placeholder="60">
            </label>
            <label>
              Room code
              <input name="roomCode" placeholder="A101">
            </label>
            <label>
              Start time
              <input name="examStart" type="datetime-local">
            </label>
            <label>
              End time
              <input name="examEnd" type="datetime-local">
            </label>
            <label class="checkbox-row">
              <input name="randomizeQuestions" type="checkbox">
              Randomize questions for students
            </label>
          </div>

          <div class="list-heading">
            <h3>Students</h3>
            <div class="inline-actions">
              <input type="file" id="import-students-file" accept=".csv">
              <button type="button" id="import-students-button">Import CSV</button>
              <button type="button" id="add-student">Add student</button>
            </div>
          </div>
          <p class="status" id="import-status"></p>
          <div id="students-list"></div>

          <div class="list-heading">
            <h3>Questions</h3>
            <button type="button" id="add-question">Add question</button>
          </div>
          <div id="questions-list"></div>

          <button class="primary" type="submit">Create exam</button>
          <p class="status" id="create-status"></p>
        </form>
      </section>

      <section id="admin-view" class="panel view hidden">
        <div class="section-heading">
          <p data-i18n="roleAdmin">Admin</p>
          <h2 data-i18n="adminHeading">Manage exams and answers</h2>
        </div>

        <form id="examiner-login-form" class="grid-3">
          <label>
            Username
            <input id="examiner-login-username" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="examiner-login-password" type="password" autocomplete="current-password" required>
          </label>
          <div class="inline-actions">
            <button class="primary" type="submit">Log in</button>
            <button type="button" id="examiner-logout">Log out</button>
          </div>
        </form>
        <p class="status" id="admin-status"></p>

        <form id="examiner-password-reset-form" class="stack panel-inner">
          <div class="grid-3">
            <label>
              Username
              <input id="examiner-reset-username" autocomplete="username" required>
            </label>
            <label>
              Recovery name
              <input id="examiner-reset-name" autocomplete="name" required>
            </label>
            <label>
              New password
              <input id="examiner-reset-password" type="password" autocomplete="new-password" required>
            </label>
          </div>
          <div class="inline-actions">
            <button class="primary" type="submit">Reset password</button>
          </div>
          <p class="status" id="examiner-reset-status"></p>
        </form>

        <form id="examiner-invite-form" class="stack panel-inner">
          <div class="grid-3">
            <label>
              Email
              <input id="examiner-invite-email" type="email" autocomplete="email" required>
            </label>
            <label>
              Exam
              <select id="examiner-invite-exam" required></select>
            </label>
            <div class="inline-actions">
              <button type="submit">Send invite</button>
            </div>
          </div>
          <p class="status" id="examiner-invite-status"></p>
        </form>

        <div id="admin-dashboard" class="hidden">
          <div class="admin-layout">
            <aside>
              <h3>Your exams</h3>
              <div id="admin-exams" class="results"></div>
            </aside>
            <section class="admin-detail">
              <div id="admin-exam-title" class="selected-exam">Select an exam</div>
              <div id="admin-exam-meta" class="meta-card"></div>
              <div id="admin-analytics" class="meta-card hidden"></div>
              <div id="admin-room" class="meta-card hidden"></div>
              <form id="add-question-form" class="add-question-form hidden">
                <label>
                  New question
                  <textarea id="admin-question-text" required></textarea>
                </label>
                <button type="submit">Add question</button>
              </form>
              <div class="inline-actions">
                <button type="button" id="export-results-button">Export results CSV</button>
              </div>
              <h3>Questions</h3>
              <div id="admin-questions" class="stack"></div>
              <h3>Results and grading</h3>
              <div id="admin-results" class="stack"></div>
              <h3>Student answers</h3>
              <div id="admin-answers" class="stack"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="student-view" class="panel view hidden">
        <div class="section-heading">
          <p data-i18n="roleStudent">Student</p>
          <h2 data-i18n="studentHeading">Find and write your exam</h2>
        </div>

        <form id="search-form" class="search-row">
          <input id="exam-search" placeholder="Search exam name" required>
          <select id="exam-status-filter">
            <option value="all">All statuses</option>
            <option value="published">Published</option>
            <option value="closed">Closed</option>
          </select>
          <button type="submit">Search</button>
        </form>

        <div id="search-results" class="results"></div>

        <form id="login-form" class="login-form hidden">
          <input type="hidden" id="selected-exam-id">
          <div class="selected-exam" id="selected-exam-name"></div>

          <div class="grid-2">
            <label>
              Username
              <input id="student-username" autocomplete="username" required>
            </label>
            <label>
              Password
              <input id="student-password" type="password" autocomplete="current-password" required>
            </label>
          </div>

          <div class="inline-actions">
            <button class="primary" type="submit">Start exam</button>
            <button type="button" id="student-logout">Log out</button>
          </div>
          <p class="status" id="login-status"></p>
        </form>

        <form id="student-password-reset-form" class="stack panel-inner hidden">
          <div class="grid-3">
            <label>
              Username
              <input id="student-reset-username" autocomplete="username" required>
            </label>
            <label>
              Exam ID
              <input id="student-reset-exam-id" required>
            </label>
            <label>
              New password
              <input id="student-reset-password" type="password" autocomplete="new-password" required>
            </label>
          </div>
          <div class="inline-actions">
            <button type="submit">Reset password</button>
          </div>
          <p class="status" id="student-reset-status"></p>
        </form>

        <div id="student-history" class="stack hidden"></div>

        <form id="answer-form" class="hidden">
          <div id="student-exam-title" class="selected-exam"></div>
          <div id="student-timer" class="timer-badge hidden"></div>
          <div id="answer-questions" class="stack"></div>
          <button class="primary" type="submit">Submit answers</button>
          <p class="status" id="answer-status"></p>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
