<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExamHub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p>ExamHub</p>
        <h1>Online exam workspace</h1>
      </div>
      <nav>
        <button type="button" data-view="create-view">Create Exam</button>
        <button type="button" data-view="admin-view">Examiner Admin</button>
        <button type="button" data-view="student-view">Student Exam</button>
      </nav>
    </header>

    <main class="shell">
      <section id="create-view" class="panel view">
        <div class="section-heading">
          <p>Examiner</p>
          <h2>Create exam and account</h2>
        </div>

        <form id="exam-form">
          <div class="grid-2">
            <label>
              Exam name
              <input name="examName" placeholder="Biology Final 2026" required>
            </label>
            <label>
              Examiner full name
              <input name="examinerName" placeholder="Mrs. Mensah" required>
            </label>
            <label>
              Examiner username
              <input name="examinerUsername" autocomplete="username" placeholder="mensah_admin" required>
            </label>
            <label>
              Examiner password
              <input name="examinerPassword" type="password" autocomplete="new-password" required>
            </label>
          </div>

          <div class="list-heading">
            <h3>Students</h3>
            <button type="button" id="add-student">Add student</button>
          </div>
          <div id="students-list"></div>

          <div class="list-heading">
            <h3>Questions</h3>
            <button type="button" id="add-question">Add question</button>
          </div>
          <div id="questions-list"></div>

          <button class="primary" type="submit">Create exam</button>
          <p class="status" id="create-status"></p>
        </form>
      </section>

      <section id="admin-view" class="panel view hidden">
        <div class="section-heading">
          <p>Admin</p>
          <h2>Manage exams and answers</h2>
        </div>

        <form id="examiner-login-form" class="grid-3">
          <label>
            Username
            <input id="examiner-login-username" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="examiner-login-password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">Log in</button>
        </form>
        <p class="status" id="admin-status"></p>

        <div id="admin-dashboard" class="hidden">
          <div class="admin-layout">
            <aside>
              <h3>Your exams</h3>
              <div id="admin-exams" class="results"></div>
            </aside>
            <section class="admin-detail">
              <div id="admin-exam-title" class="selected-exam">Select an exam</div>
              <form id="add-question-form" class="add-question-form hidden">
                <label>
                  New question
                  <textarea id="admin-question-text" required></textarea>
                </label>
                <button type="submit">Add question</button>
              </form>
              <h3>Questions</h3>
              <div id="admin-questions" class="stack"></div>
              <h3>Student answers</h3>
              <div id="admin-answers" class="stack"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="student-view" class="panel view hidden">
        <div class="section-heading">
          <p>Student</p>
          <h2>Find and write your exam</h2>
        </div>

        <form id="search-form" class="search-row">
          <input id="exam-search" placeholder="Search exam name" required>
          <button type="submit">Search</button>
        </form>

        <div id="search-results" class="results"></div>

        <form id="login-form" class="login-form hidden">
          <input type="hidden" id="selected-exam-id">
          <div class="selected-exam" id="selected-exam-name"></div>

          <div class="grid-2">
            <label>
              Username
              <input id="student-username" autocomplete="username" required>
            </label>
            <label>
              Password
              <input id="student-password" type="password" autocomplete="current-password" required>
            </label>
          </div>

          <button class="primary" type="submit">Start exam</button>
          <p class="status" id="login-status"></p>
        </form>

        <form id="answer-form" class="hidden">
          <div id="student-exam-title" class="selected-exam"></div>
          <div id="answer-questions" class="stack"></div>
          <button class="primary" type="submit">Submit answers</button>
          <p class="status" id="answer-status"></p>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
